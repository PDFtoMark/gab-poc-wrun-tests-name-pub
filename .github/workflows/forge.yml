name: Tests

on: pull_request

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Write attacker-controlled coverage artifact
        run: |
          cat > coverage.xml <<'XML'
          <?xml version="1.0" ?>
          <coverage version="7.0" timestamp="1" lines-valid="10" lines-covered="10" line-rate="1.0" branches-valid="0" branches-covered="0" branch-rate="0" complexity="0">
            <sources><source>/home/runner</source></sources>
            <packages>
              <package name="pkg" line-rate="1.0" branch-rate="0" complexity="0">
                <classes>
                  <class name="A" filename="MARKER_FROM_ATTACKER_XML" line-rate="1.0" branch-rate="0" complexity="0">
                    <methods/>
                    <lines><line number="1" hits="1"/></lines>
                  </class>
                </classes>
              </package>
            </packages>
          </coverage>
          XML
          cat > coverage-junit.xml <<'XML'
          <?xml version="1.0" ?>
          <testsuites>
            <testsuite errors="0" failures="0" skipped="0" tests="3" time="0.5">
              <testcase classname="c" name="n"/>
            </testsuite>
          </testsuites>
          XML
          ls -la coverage.xml coverage-junit.xml
          echo "ATTACKER_WORKFLOW_RAN name=${{ github.workflow }}"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            coverage-junit.xml
